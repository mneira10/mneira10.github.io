interface:
  display_name: "UpCodes PR Review"
  short_description: "Review UpCodes PRs; optionally draft comments into your pending GitHub review"
  default_prompt: "Use $upcodes-pr-review to review the latest version of my PR against its base branch, running each narrow check in its own subagent (readability, simplicity, reuse, styleguide, bugs, an independent security analysis, plus tests/migrations/AI when relevant) and merging their findings. Leave routine checks to CI."
policy:
  allow_implicit_invocation: false
