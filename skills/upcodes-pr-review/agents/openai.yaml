interface:
  display_name: "UpCodes PR Review"
  short_description: "Review UpCodes PRs; optionally draft comments into your pending GitHub review"
  default_prompt: "Use $upcodes-pr-review to review my checked-out branch against its local base, fanning out the narrow checks (readability, simplicity, reuse, styleguide, bugs, plus tests/migrations/AI when relevant) and merging their findings. Leave routine checks to CI."
policy:
  allow_implicit_invocation: false
